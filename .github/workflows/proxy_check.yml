name: Remote URL Proxy Check

on:
  schedule:
    - cron: '0 */8 * * *' # 每 8 小时运行一次
  workflow_dispatch:      # 支持手动触发
  push:
    paths:
      - 'url.txt'         # 当 URL 列表更新时触发

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install aiohttp

      - name: Run Proxy Check
        # 核心部分：通过 env 将 Secret 映射为环境变量
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: python check_ips.py

      - name: Commit Results
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add valid_ips.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update Valid IPs from Remote URLs" && git push)